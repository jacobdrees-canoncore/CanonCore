packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
# Every third-party version in this repo is pinned here and nowhere else. A range
# written inline in a package.json is drift waiting to happen: the generator left
# @orpc/tanstack-query inline at the same version the other four @orpc packages
# were catalogued at, which is exactly what a catalogue exists to prevent. That
# package is gone now, along with the TanStack Query pair it fed -- CNCORE-65
# deleted the last caller -- so the example survives its subject, which is fine:
# it is the reason the rule exists rather than a description of the tree.
catalog:
  # Toolchain
  typescript: ^7.0.2
  "@types/node": ^26.2.0
  turbo: ^2.10.12
  "@biomejs/biome": ^2.5.12
  vitest: ^5.0.0
  yaml: ^2.9.0
  # GitHub's own expression parser, from actions/languageservices -- the same
  # engine the Actions runner and the workflow language server use. It is here so
  # the concurrency-key test evaluates the key rather than string-matching it.
  # 0.x, so the caret pins it below 0.4: worth watching on a bump.
  "@actions/expressions": ^0.3.61
  # The browser seam (ADR-0103, CNCORE-73). The `playwright` LIBRARY inside the
  # Vitest suite rather than its test runner or Vitest's browser mode -- see
  # `apps/web/browser/global-setup.ts` for why.
  playwright: ^1.63.0

  # Framework
  next: ^16.3.4
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  babel-plugin-react-compiler: ^1.0.0
  "@swc/helpers": ^0.5.23

  # API
  "@orpc/server": ^1.15.0
  "@orpc/client": ^1.15.0
  "@orpc/openapi": ^1.15.0
  "@orpc/zod": ^1.15.0

  # Database. drizzle-orm stable has not moved since 2026-03-27 while 1.0.0 sits
  # at rc; see ADR-0102 for why this repo stays on the stable line for now.
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
  pg: ^8.22.0
  "@types/pg": ^8.20.0

  # Outbound boundary (ADR-0034). ipaddr.js is the vocabulary the deny rule is
  # written in -- `range()` returning the `unicast` catch-all is the whole test --
  # and undici is what supplies an Agent whose `connect.lookup` hook can pin a
  # connection without touching the URL's host.
  "ipaddr.js": ^2.5.0
  undici: ^8.10.2

  # Validation and config
  # ADR-0073's dates. `parse` rather than the default `edtf()` export, which
  # short-circuits any string of 5+ digits to a Unix millisecond timestamp.
  edtf: ^4.11.1
  zod: ^4.4.3
  dotenv: ^17.4.2
  "@t3-oss/env-core": ^0.13.11

  # UI
  tailwindcss: ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  "@base-ui/react": ^1.6.0
  shadcn: ^4.16.0
  class-variance-authority: ^0.7.1
  cn: ^0.2.4
  lucide-react: ^1.27.0
  # THE DRAG (CNCORE-73), AND EXACT VERSIONS RATHER THAN CARETS. dnd-kit's 0.x
  # packages release in lockstep and ship breaking changes in MINOR bumps, filed
  # under "Minor Changes": 0.4.0 split `DragDropEvents` and moved `feedback` into
  # plugin configuration, each with a migration guide. A caret would take those
  # on a `pnpm update`. Only the two this repo IMPORTS are declared; `@dnd-kit/dom`,
  # `@dnd-kit/state` and `@dnd-kit/abstract` come in underneath them and are held
  # by the frozen lockfile (ADR-0106), which is where a transitive bump has to
  # pass through a reviewed diff.
  "@dnd-kit/react": 0.5.0
  "@dnd-kit/helpers": 0.5.0
  tw-animate-css: ^1.4.0
