name: canoncore

services:
  postgres:
    image: postgres:18
    container_name: canoncore-postgres
    environment:
      POSTGRES_DB: canoncore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      # NOT 5432, deliberately and permanently. A developer machine very often
      # already runs PostgreSQL, and the failure when it does is SILENT rather
      # than loud: Docker binds the 0.0.0.0 wildcard, a local server binds the
      # more specific 127.0.0.1, and the specific bind wins for `localhost`. So
      # `docker compose up` reports success, the container is healthy, and every
      # connection goes to the other server. Measured on this repo: `psql -h
      # localhost` answered 17.11 (Homebrew) while `docker exec` answered 18.6
      # (this container), and a whole ticket's tests ran against the wrong one.
      #
      # Supabase's CLI defaults its local database to 54322 for the same reason.
      # Override with CANONCORE_DB_PORT when 55432 is taken too. See ADR-0104,
      # and `src/docker-compose.test.ts`, which fails if this goes back to 5432.
      - "${CANONCORE_DB_PORT:-55432}:5432"
    # ONE CONTAINER SERVES EVERY WORKTREE (ADR-0104), AND POSTGRES'S DEFAULT
    # CEILING IS SIZED FOR ONE APP RATHER THAN FOR THAT.
    #
    # `pnpm test:e2e` stands up TEN CanonCore servers at once, each a real app
    # process with the pool a real one has, against ten databases in here. That
    # is one worktree. ADR-0104 puts the next worktree's ten in the same
    # container, and the default `max_connections` is 100 for all of them
    # together.
    #
    # MEASURED ON THIS REPO, 2026-09-13, sampling `pg_stat_activity` once a
    # second through a full run: ONE suite peaks at about 100 CLIENT connections
    # on its own -- already the whole budget -- and a second worktree running
    # its suite beside it takes the total past the ceiling. The failure is
    # `sorry, too many clients already`, and it surfaces as an unrelated test
    # failing in whichever suite asked last rather than as anything naming the
    # limit.
    #
    # 300 IS THREE OF THOSE SUITES, which is what a machine running three
    # worktrees needs and is the number ADR-0104's own decision implies.
    command: ["postgres", "-c", "max_connections=300"]
    # THE SAME ONE CONTAINER HOLDS EVERY DATABASE'S STATISTICS IN /dev/shm, AND
    # DOCKER'S DEFAULT OF 64 MB HOLDS THE LIVE WORKTREES' BUT NOT THE DEAD ONES'.
    #
    # PostgreSQL 18 keeps its cumulative statistics, an entry for every table
    # and index any database has touched, in a dynamic shared memory area. Its
    # segments are files in /dev/shm, sized 1, 2, 2, 4, 4, 8, 8, 16, 16, 32 MB
    # and on, each fallocated in full, and one goes back only once every entry
    # in it is gone. A clean restart writes the statistics out and reads them
    # back in, so restarting frees nothing.
    #
    # MEASURED ON THIS REPO, 2026-09-19: a database of this schema costs about
    # 57 KiB there, and 64 MB ran out at database 1,090 of them with the same
    # `could not resize shared memory segment ... to 33554432 bytes` the shared
    # container was failing with. Four agents and the main checkout own about
    # 95 databases, 5 MB. What filled it was 1,149, most of them left by removed
    # worktrees, and nothing drops those until CNCORE-231.
    #
    # 256 MB IS THE FIRST SIZE THAT HOLDS THE 253 MB STEP of that series, about
    # 4,500 databases, and the example the postgres image's docs give for this
    # error. 512 MB would be most of what a 2 GB Docker VM has free: /dev/shm is
    # RAM, and past that the OOM killer picks a process anywhere in the VM
    # instead of PostgreSQL failing in its own container. ADR-0104 has the
    # arithmetic, and `src/docker-compose.test.ts` fails if this goes.
    #
    # TODO(CNCORE-233): a worktree whose copy of this file differs recreates
    # the container on `db:start`, cutting every other worktree's run.
    shm_size: 256mb
    volumes:
      - canoncore_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  canoncore_postgres_data:
