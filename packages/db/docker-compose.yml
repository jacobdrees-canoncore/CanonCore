# ONE PROJECT NAME FOR EVERY WORKTREE, SO ONE CONTAINER FOR ALL OF THEM
# (ADR-0104). The requirement is that the name be ONE name, and never that it be
# a PARTICULAR one: nothing reads it, and the container is reached by the
# `container_name` below, which Compose does not prefix with the project.
#
# IT IS `canoncore-dev` SO THAT THIS STACK AND THE OWNER'S INSTALL ARE DISJOINT
# (CNCORE-250). Both ran as `canoncore` until then, from two directories, so
# each one's ordinary `up` called the other's containers ORPHANS and recommended
# `--remove-orphans` for them -- which from here stops and removes the Owner's
# running instance, and from there removes this container. Compose only ever
# considers containers carrying its OWN `com.docker.compose.project`, so two
# names is the whole of the fix. `src/docker-compose.test.ts` fails if the two
# files are ever brought back onto one name.
#
# A CHANGE TO THIS FILE DOES NOT REACH THE RUNNING CONTAINER BY ITSELF, ON
# PURPOSE. `db:start` passes `--no-recreate`: it creates the container when there
# is none and starts it when it is stopped, and it never recreates one. A
# recreate cuts every connection in every worktree, and without the flag the
# last worktree to run `db:start` would decide what the container is
# (CNCORE-233). A branch that changes this file tests the change on a throwaway
# container of its own. Once the change is on `main`, the Owner applies it from
# the main checkout while no suite is running:
#
#   docker compose up -d --dry-run   # `Recreate` = it differs
#   docker compose up -d
#
# THE RENAME IS THE ONE CHANGE THAT ROUTE CANNOT APPLY, because the running
# container is labelled with the OLD project and the new one therefore does not
# own it. Once, from the main checkout with no suite running:
#
#   docker compose config --format json   # the volume MUST read canoncore_canoncore_postgres_data
#   docker stop -t 60 canoncore-postgres && docker rm canoncore-postgres
#   docker compose up -d
#
# `config` rather than `--dry-run` for the check, because the step that has to
# be right here is the VOLUME and a dry run does not resolve one: `config` is
# what prints the name Compose would mount, and it is the whole of what stands
# between this rename and an empty database. The step after it is a plain
# `docker rm`, which no dry run covers either.
#
# Every worktree's database is on the pinned volume at the foot of this file and
# `docker rm` does not touch a named volume, so what that costs is the
# connections, as any recreate does. NAME THE CONTAINER, never the install's:
# `canoncore-canoncore-1` and `canoncore-database-1` are the Owner's instance,
# and `docker compose -p canoncore down` from here would be aimed at the project
# they are in.
#
# UNTIL THAT IS RUN, A WORKTREE ON THIS FILE DOES NOT OWN THE RUNNING CONTAINER.
# `db:start` is a create-if-absent, the container is already up, and `db:setup`
# is all a worktree needs to join it. Check `docker ps` rather than starting it.
name: canoncore-dev

services:
  postgres:
    image: postgres:18
    container_name: canoncore-postgres
    environment:
      POSTGRES_DB: canoncore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      # NOT 5432, deliberately and permanently. A developer machine very often
      # already runs PostgreSQL, and the failure when it does is SILENT rather
      # than loud: Docker binds the 0.0.0.0 wildcard, a local server binds the
      # more specific 127.0.0.1, and the specific bind wins for `localhost`. So
      # `docker compose up` reports success, the container is healthy, and every
      # connection goes to the other server. Measured on this repo: `psql -h
      # localhost` answered 17.11 (Homebrew) while `docker exec` answered 18.6
      # (this container), and a whole ticket's tests ran against the wrong one.
      #
      # Supabase's CLI defaults its local database to 54322 for the same reason.
      # Override with CANONCORE_DB_PORT when 55432 is taken too, before the
      # container is first created: `db:start` never recreates it, so the port
      # is fixed from then on. See ADR-0104, and `src/docker-compose.test.ts`,
      # which fails if this goes back to 5432.
      - "${CANONCORE_DB_PORT:-55432}:5432"
    # ONE CONTAINER SERVES EVERY WORKTREE (ADR-0104), AND POSTGRES'S DEFAULT
    # CEILING IS SIZED FOR ONE APP RATHER THAN FOR THAT.
    #
    # `pnpm test:e2e` stands up TEN CanonCore servers at once, each a real app
    # process with the pool a real one has, against ten databases in here. That
    # is one worktree. ADR-0104 puts the next worktree's ten in the same
    # container, and the default `max_connections` is 100 for all of them
    # together.
    #
    # MEASURED ON THIS REPO, 2026-09-13, sampling `pg_stat_activity` once a
    # second through a full run: ONE suite peaks at about 100 CLIENT connections
    # on its own -- already the whole budget -- and a second worktree running
    # its suite beside it takes the total past the ceiling. The failure is
    # `sorry, too many clients already`, and it surfaces as an unrelated test
    # failing in whichever suite asked last rather than as anything naming the
    # limit -- EXCEPT through `refusal`, which since ADR-0184 throws naming the
    # SQLSTATE rather than answering as though a constraint had bitten. Every
    # other seam still reports it the way this sentence says.
    #
    # AND THAT PEAK IS `pnpm test:e2e`'s, NOT `pnpm test`'s (CNCORE-280). The
    # same sampling through a whole green `pnpm test` on 2026-09-21 peaks at
    # THIRTEEN connections, because turbo's `dependsOn: ["^test"]` serialises
    # the three suites that reach a database. A flake under `pnpm test` is
    # therefore not this ceiling, and ADR-0184 says what was measured instead.
    #
    # 300 IS THREE OF THOSE SUITES, which is what a machine running three
    # worktrees needs and is the number ADR-0104's own decision implies.
    command: ["postgres", "-c", "max_connections=300"]
    # THE SAME ONE CONTAINER HOLDS EVERY DATABASE'S STATISTICS IN /dev/shm, AND
    # DOCKER'S DEFAULT OF 64 MB HOLDS THE LIVE WORKTREES' BUT NOT THE DEAD ONES'.
    #
    # PostgreSQL 18 keeps its cumulative statistics, an entry for every table
    # and index any database has touched, in a dynamic shared memory area. Its
    # segments are files in /dev/shm, sized 1, 2, 2, 4, 4, 8, 8, 16, 16, 32 MB
    # and on, each fallocated in full, and one goes back only once every entry
    # in it is gone. A clean restart writes the statistics out and reads them
    # back in, so restarting frees nothing.
    #
    # MEASURED ON THIS REPO, 2026-09-19: a database of this schema costs about
    # 57 KiB there, and 64 MB ran out at database 1,090 of them with the same
    # `could not resize shared memory segment ... to 33554432 bytes` the shared
    # container was failing with. Four agents and the main checkout own about
    # 95 databases, 5 MB. What filled it was 1,149, most of them left by removed
    # worktrees. `pnpm db:setup` drops those since CNCORE-231: every worktree
    # runs it to join this container, and it sweeps whatever no live worktree
    # owns. That bounds the demand, which is what this ceiling alone could not.
    #
    # 256 MB IS THE FIRST SIZE THAT HOLDS THE 253 MB STEP of that series, about
    # 4,500 databases, and the example the postgres image's docs give for this
    # error. 512 MB would be most of what a 2 GB Docker VM has free: /dev/shm is
    # RAM, and past that the OOM killer picks a process anywhere in the VM
    # instead of PostgreSQL failing in its own container. ADR-0104 has the
    # arithmetic, and `src/docker-compose.test.ts` fails if this goes.
    shm_size: 256mb
    volumes:
      - canoncore_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# PINNED BY NAME, SO THE PROJECT NAME ABOVE CARRIES NO DATA. A volume with no
# `name:` of its own is prefixed with the project, so renaming the project would
# have pointed this service at a NEW AND EMPTY volume and left every worktree's
# database on the old one. Measured 2026-09-21 with `docker compose config`,
# which resolves volume names the way Compose does: unpinned, `canoncore-dev`
# read `canoncore-dev_canoncore_postgres_data` where `canoncore` read
# `canoncore_canoncore_postgres_data` -- the volume that exists.
#
# The pinned name is the one the volume ALREADY HAS, which is why the rename
# keeps the databases rather than migrating them. `compose.yaml` pins the
# install's `canoncore_data` for the same reason, one collision earlier.
#
# SO COMPOSE WARNS ON EVERY `up`, PERMANENTLY, AND THAT IS EXPECTED:
#
#   volume "canoncore_canoncore_postgres_data" already exists but was created
#   for project "canoncore" (expected "canoncore-dev")
#
# The volume carries `com.docker.compose.project=canoncore` from the project
# that created it, and a label on an existing volume is not rewritten. ADR-0137
# measured this exact warning when the install's directory was renamed over its
# own pinned volume, and records that it is not a fault and does not go away.
# The remedy Compose suggests, `external: true`, is the one to refuse: it makes
# a FIRST `db:start` in a fresh clone fail on a volume that does not exist yet.
volumes:
  canoncore_postgres_data:
    name: canoncore_canoncore_postgres_data
