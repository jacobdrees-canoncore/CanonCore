name: Checkout timing (temporary, CC-422)

# Times each full-history checkout full against blobless, five times each, with the step that
# reads the history after it. Deleted before CC-422 merges.
on:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan ${{ matrix.filter }} ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        filter: [full, blobless]
        rep: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: ${{ matrix.filter == 'blobless' && 'blob:none' || '' }}
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --redact --verbose /repo

  standing:
    name: Standing decisions ${{ matrix.filter }} ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        filter: [full, blobless]
        rep: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          filter: ${{ matrix.filter == 'blobless' && 'blob:none' || '' }}
      - name: Read the section at the fork and the head
        env:
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --quiet "https://github.com/$REPO" "+refs/pull/$NUMBER/head:refs/remotes/pr/head"
          git cat-file -e "$BASE^{commit}"
          git cat-file -e "$HEAD^{commit}"
          doc=docs/agents/dispatching.md
          fork=$(git merge-base "$BASE" "$HEAD")
          git show "$fork:$doc" | wc -l
          git show "$HEAD:$doc" | wc -l
