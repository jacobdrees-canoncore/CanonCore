name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # GitHub's own secret scanning needs paid Secret Protection on private repos.
      # gitleaks covers the same ground for free. Run the binary directly rather than
      # gitleaks-action, which requires a paid licence key for organisation repos.
      # `git` replaced `detect --source` in v8.19.0; the old form is deprecated and hidden.
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git --no-banner --redact --verbose /repo

  docs:
    name: Agent docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: CLAUDE.md stays under 200 lines
        run: |
          lines=$(wc -l < CLAUDE.md)
          echo "CLAUDE.md is $lines lines"
          if [ "$lines" -ge 200 ]; then
            echo "::error file=CLAUDE.md::CLAUDE.md is $lines lines. The 13th principle in its standard block: \"Keep this file a pointer file, under 200 lines. Repeated gotchas become checks (lint, hooks, CI), not prose here.\""
            exit 1
          fi
      # CanonCore's CLAUDE.md holds the master copy of the standard, between the markers
      # below, so there is nothing to compare it with here. Each other repository's CI
      # compares its own block with this file on main.
      - name: CLAUDE.md carries the standard between its markers
        run: |
          start='<!-- standard:start -->'
          end='<!-- standard:end -->'
          s=$(grep -nxF "$start" CLAUDE.md | cut -d: -f1)
          e=$(grep -nxF "$end" CLAUDE.md | cut -d: -f1)
          if ! [[ "$s" =~ ^[0-9]+$ && "$e" =~ ^[0-9]+$ ]] || [ "$((s + 1))" -ge "$e" ] ||
             ! sed -n "$((s + 1)),$((e - 1))p" CLAUDE.md | grep -q '[^[:space:]]'; then
            echo "::error file=CLAUDE.md::CLAUDE.md must carry the standard between one '$start' line and one later '$end' line. Fix: restore them from main, git show origin/main:CLAUDE.md"
            exit 1
          fi
          echo "CLAUDE.md carries the standard on lines $((s + 1)) to $((e - 1))"
      - name: Agent docs referenced by CLAUDE.md exist
        run: |
          fail=0
          for f in docs/agents/issue-tracker.md docs/agents/triage-labels.md docs/agents/domain.md docs/agents/workflow.md; do
            [ -f "$f" ] || { echo "::error::missing $f"; fail=1; }
          done
          exit $fail

  hooks:
    name: Claude hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The launch hook refuses a raw Claude launch and allows the rest
        run: |
          set +e  # the cases expect exit 2; Actions runs bash with -e
          hook=.claude/hooks/refuse-raw-claude-launch.sh
          fail=0
          expect() { # <exit code> <command>
            jq -n --arg c "$2" '{tool_name: "Bash", tool_input: {command: $c}}' | "$hook" 2>/dev/null
            got=$?
            if [ "$got" = "$1" ]; then echo "ok   exit $got: $2"; else echo "::error::exit $got, wanted $1: $2"; fail=1; fi
          }
          expect 2 'orca terminal create --worktree path:/w --title Claude --command claude'
          expect 2 "orca terminal create --worktree path:/w --json --command 'claude --model opus \"/implement CC-1\"'"
          expect 2 'cd /w && orca  terminal  create --command "claude"'
          expect 0 '~/.claude/skills/dispatch/launch.sh /w CC-1 --base main'
          expect 0 'orca terminal create --worktree path:/Users/me/.claude/x --command zsh'
          expect 0 'orca terminal list --json'
          exit $fail

  # Add lint / typecheck / test jobs here once a stack exists. Keep them as separate
  # jobs so a red check names the thing that broke.
