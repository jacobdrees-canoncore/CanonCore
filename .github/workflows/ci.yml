name: CI

on:
  pull_request:
  push:
    branches: [main]
    # THE RELEASE TRIGGER (CNCORE-70). A version tag runs the whole file again
    # at the tagged commit and publishes the image at that version, which is
    # what gives a release note something a stranger can pull. Everything else
    # here already distinguishes `main` from a branch; the conditions in the
    # image jobs name this ref explicitly rather than widening to every push.
    #
    # THE PATTERN IS A VERSION AND NOT MERELY A `v`. A tag is a name anybody can
    # push, `v*` would admit `vtest`, and a release path that publishes under
    # the project's own name is not a thing to leave open on a prefix. The shape
    # is GitHub's own documented one for semantic versions -- its cheat sheet
    # gives `v[12].[0-9]+.[0-9]+` -- where `[0-9]` is a character range and `+`
    # is one-or-more of the preceding character (read 2026-09-12).
    #
    # AND IT IS THE AUTHORITATIVE GATE, tighter than the `if:` conditions below,
    # which can only say `startsWith(..., 'refs/tags/v')` because expressions
    # have no globbing. A `v`-prefixed tag that is not a version satisfies those
    # conditions and still publishes nothing, because it never starts a run.
    #
    # A CONSEQUENCE WORTH STATING: a pre-release tag such as `v0.2.0-rc1` does
    # not match, so it neither builds nor publishes. That is the safe end and it
    # is a choice; widen this line when a pre-release is actually wanted.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# One run per pull request branch, and the newest wins.
#
# THE FALLBACK IS THE LOAD-BEARING HALF. `github.head_ref` is defined only on
# `pull_request` and `pull_request_target` events, so on a push to `main` it is
# empty, the group becomes the run's own id, and that group has exactly one
# member which nothing can cancel. The default branch is spared by the shape of
# the key rather than by a condition somebody has to maintain.
#
# DO NOT REPLACE THIS WITH `github.ref`. It makes `refs/heads/main` a group like
# any other, and it has already cost this organisation a verdict in
# provider-wiki. ADR-0111 carries that incident and the numbers.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Every job that builds needs this to be a non-empty string. The jobs carrying
  # a postgres service genuinely connect to it; the rest only need it non-empty,
  # and the `env-guard` job below deliberately blanks it for its one step.
  DATABASE_URL: postgresql://postgres:password@localhost:5432/canoncore
  # For the migration jobs, which make databases of their own.
  BASE_URL: postgresql://postgres:password@localhost:5432
  ADMIN_URL: postgresql://postgres:password@localhost:5432/postgres
  # A manifest changed without its lockfile must fail the build rather than
  # quietly resolving something else. pnpm loads any PNPM_CONFIG_* variable as
  # configuration, so this is `--frozen-lockfile` reaching every install in the
  # file -- including the one pnpm/setup runs before any `run:` step.
  #
  # pnpm's own "true in CI" default was already doing this, which is why the
  # dead `require-lockfile` input this replaces cost nothing. Said outright
  # anyway: that default is conditional on pnpm's CI detection, and a gate that
  # holds for a reason the file does not state is one nobody can watch break.
  # Both halves were run on a real runner rather than reasoned about; the runs
  # are in ADR-0106.
  PNPM_CONFIG_FROZEN_LOCKFILE: true
  # THE PUBLISHED IMAGE'S IDENTITY, AND IT IS WRITTEN ONCE. The tags, the digest
  # push, the manifest list and the visibility assert all take it from here.
  # provider-wiki had those as separate derivations that agreed by coincidence
  # until CNCORE-45: rename the package and the push writes the new name while
  # the assert asks about the old one, reporting green having checked a package
  # nothing published.
  IMAGE: ghcr.io/jacobdrees-canoncore/canoncore

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # GitHub's own secret scanning needs paid Secret Protection on private repos.
      # gitleaks covers the same ground for free. Run the binary directly rather than
      # gitleaks-action, which requires a paid licence key for organisation repos.
      # `git` replaced `detect --source` in v8.19.0; the old form is deprecated and hidden.
      #
      # Pinned by tag AND digest. The digest is the multi-arch OCI index for
      # v8.30.1, so it resolves on amd64 runners as well as arm64.
      #
      # BUMP THIS BY HAND. Dependabot cannot reach it: its docker and
      # docker-compose ecosystems scan Dockerfiles, compose files and Kubernetes
      # manifests, never shell inside a `run:` block. A secret scanner that goes
      # stale quietly loses detection rules, so this line is worth a glance
      # whenever CI is touched.
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --redact --verbose /repo

  docs:
    name: Agent docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: CLAUDE.md stays under 200 lines
        run: |
          lines=$(wc -l < CLAUDE.md)
          echo "CLAUDE.md is $lines lines"
          if [ "$lines" -gt 200 ]; then
            echo "::error file=CLAUDE.md::CLAUDE.md is $lines lines, over the 200-line limit set in its own Principles."
            exit 1
          fi
      # THE TREE IS SEEDED INTO A PUBLIC REPOSITORY, and a string that reaches
      # it cannot be taken back: ADR-0114 records why a history rewrite does not
      # undo publication. So the scrub CNCORE-61 did is a gate rather than an
      # event. gitleaks above does not cover this ground -- it looks for
      # credentials, and neither of these is one, which is the same reason
      # ADR-0114 gives for GitHub Support declining to remove them.
      #
      # NEITHER PATTERN IS THE STRING IT GUARDS, and that is the point rather
      # than obfuscation. This file is seeded like the rest of the tree, so a
      # gate spelling the hostname would be the last copy of the very thing it
      # removes, and CNCORE-61's acceptance criterion is that a plain grep for
      # it returns NOTHING. Each pattern is deliberately broader than its
      # target: the bare host label, which ADR-0109 carried on its own three
      # times after the fully qualified name had gone, and the home directory
      # that every absolute path into this machine starts with. Broader is also
      # simply better here -- both leaks the reviewers found were the wider
      # form, not the narrow one. `ci-workflow.test.ts` pins this, because
      # spelling either value back in is a one-line "simplification" that CI
      # cannot catch: the gate excludes itself from its own search.
      #
      # THE STATUS IS READ RATHER THAN BRANCHED ON. `git grep` exits 1 on no
      # match but 2 or 128 on error, and an `if` cannot tell the second from the
      # first -- so a mistyped pathspec would report this gate green having
      # searched nothing. That is the silent pass ADR-0111 and CNCORE-3 are
      # about, and it is the failure mode a gate is least likely to be caught
      # having.
      - name: Nothing unpublishable in the tree
        run: |
          fail=0
          scan() {
            # `found`, not `status`: zsh makes `status` read-only, so the obvious
            # name breaks the moment somebody pastes this into a terminal on the
            # Mac this repo is developed on. It runs under bash in CI either way.
            local found=0
            git grep -niF "$1" -- . ':!.github/workflows/ci.yml' || found=$?
            if [ "$found" -gt 1 ]; then
              echo "::error::The publishability search itself failed (git grep exit $found), so it has decided nothing."
              exit 2
            fi
            [ "$found" -eq 0 ] || return 0
            echo "::error::$2"
            fail=1
          }
          scan 'yuzu' "The owner's personal host is named in the tree. ADR-0109 argues from the slot's plan, price, region and what the SSH session proved; the name is an invitation and proves nothing."
          scan '/Users/jacobrees' "An absolute path into the owner's machine is in the tree. It resolves for nobody else, and it says where this checkout happens to sit."
          scan 'heathways' "The owner's slot USERNAME is in the tree. CNCORE-61 removed the hostname of that pair and left this half, which is the more useful half to anyone holding the other: a name and a host is most of a login. Broader than the username itself, for the reason the first pattern is broader than the hostname."
          exit $fail

      - name: Agent docs referenced by CLAUDE.md exist
        run: |
          fail=0
          for f in docs/agents/issue-tracker.md docs/agents/triage-labels.md docs/agents/domain.md; do
            [ -f "$f" ] || { echo "::error::missing $f"; fail=1; }
          done
          exit $fail

  # SEPARATE JOBS, SO A RED CHECK NAMES THE THING THAT BROKE rather than making
  # someone open the log to find out. That is this file's own sentence, it was
  # here before CNCORE-35, and CNCORE-80 put it back.
  #
  # WHAT MERGED THESE FOUR AND WHAT UNMERGED THEM ARE THE SAME ARGUMENT. GitHub
  # bills per job ROUNDED UP TO THE WHOLE MINUTE, so four jobs doing 44 seconds
  # of work between them billed four minutes and one billed one; ADR-0111 traded
  # the sentence above for those three minutes deliberately. CNCORE-62 then made
  # this repository PUBLIC, and GitHub bills standard runners nothing at all in a
  # public repository. Four minutes and one are both zero here now, so the trade
  # buys nothing and the principle comes back.
  #
  # DO NOT COPY THIS SHAPE INTO provider-wiki OR provider-tmdb. They stay private
  # under ADR-0089, their minutes are still billed, and ADR-0111's arithmetic is
  # as load-bearing there as it ever was. The record carries which half of it
  # survived and where.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm/setup installs pnpm and Node in one step and is what pnpm itself
      # recommends from pnpm 11 on. The pnpm version comes from the
      # packageManager field, and `pnpm install` runs automatically. What makes
      # that install frozen is PNPM_CONFIG_FROZEN_LOCKFILE above, not anything
      # said here: this action has no input for lockfile strictness at all.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      # BEHIND THE GUARD for the reason every suite job is (CNCORE-191).
      # `turbo run typecheck` exits 0 having run zero tasks exactly as
      # `turbo run test` does, so this job went green having typechecked no
      # package at all if the scripts went. CNCORE-160 scoped itself to the jobs
      # that run a SUITE and left this one, the Build job and the two ladder
      # invocations bare; the guard already took a task name.
      - name: Typecheck, and assert it actually ran
        run: .github/scripts/run-suite.sh typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      # No "did it actually run anything?" guard here, and that is deliberate
      # rather than forgotten. The Test job needs one because `turbo run test`
      # exits 0 having run zero tasks. Biome does the opposite: it exits 1 with
      # "No files were processed in the specified paths" when nothing matches,
      # so an empty or over-ignored config fails this job by itself. A test in
      # packages/config pins that, since it is the vendor's behaviour, not ours.
      #
      # `pnpm lint` is `biome ci`, which emits ::error annotations, so a failure
      # lands on the diff rather than only in this log.
      - run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Build, and assert it actually ran
        run: .github/scripts/run-suite.sh build

  # THE SAME COMMAND AS THE BUILD JOB ABOVE, REQUIRED TO FAIL. The generator's
  # env validation once passed a build with no DATABASE_URL at all, failing
  # instead on the first request that touched the database. This job is what
  # stops that regressing: apps/web/.env is gitignored, so a CI checkout
  # genuinely has no value to find.
  #
  # AND IT IS THE ONLY TURBO INVOCATION ANYWHERE IN THIS FILE LEFT BARE
  # (CNCORE-191), `pnpm lint` not being turbo at all. The
  # guard everywhere else exists because `turbo run <task>` exits 0 having run
  # zero tasks; here that is the RIGHT behaviour, because this step requires the
  # build to fail, so a build that ran nothing exits 0 and reddens the job
  # correctly. Guarding it would invert the check. The reason is restated in
  # `run-suite.test.ts`'s exemption list, which is the copy a check can read: a
  # comment here is dropped by the YAML parse that suite reads the file through.
  #
  # IT DOES NOT CONTRADICT THE BUILD JOB, and the mechanism is worth stating,
  # because it is the one thing that could make this job lie. `turbo.json`
  # declares DATABASE_URL in the `build` task's `env`, so the value is part of
  # the task hash: blanking it can never replay a cached success, here or on any
  # remote cache added later. And the obvious way to break that is not silent
  # either: drop the declaration and Turbo's strict env mode stops passing
  # DATABASE_URL to the task at all, which fails the Build job above on every
  # run. There is no arrangement in which this job quietly stops biting.
  env-guard:
    name: Env guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Missing DATABASE_URL fails the build
        env:
          DATABASE_URL: ""
        run: |
          if pnpm build > build.log 2>&1; then
            echo "::error::pnpm build succeeded with no DATABASE_URL. The env validation is not reaching the build."
            tail -40 build.log
            exit 1
          fi
          if ! grep -q "Invalid environment variables" build.log; then
            echo "::error::pnpm build failed, but not on env validation. Something else is broken."
            tail -40 build.log
            exit 1
          fi
          echo "Build failed on env validation, as it should."


  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      # Migration 1 lands real tables, so the suites that read them need a real
      # server. postgres:18 matches packages/db/docker-compose.yml, so CI and a
      # developer's machine agree about what the ladder is applied to.
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: canoncore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
      # THE CHECK THIS JOB CARRIED ALONE UNTIL CNCORE-160, now the one script
      # every suite job runs behind. Why the count is read rather than the exit
      # code, and what that does and does not catch, is in `run-suite.sh`'s own
      # header and in ADR-0103 -- stated once there rather than a third time
      # here.
      #
      # THE PACKAGE IS NAMED BECAUSE A COUNT IS NOT A ROLL CALL (CNCORE-190).
      # `test` is declared by ten packages, so the one that drops its script
      # leaves nine running and the count green -- and the one whose loss costs
      # most is `@canoncore/config`, whose suite is every check this repository
      # makes of `ci.yml`, `pnpm-workspace.yaml`, the network gate's wiring, the
      # Biome config and the Node major. Measured: with its `test` script gone
      # the job read `Tasks: 9 successful, 9 total` and passed.
      - name: Test, and assert both the suite and its policing package ran
        run: .github/scripts/run-suite.sh test @canoncore/config

  migrations:
    name: Migration ladder
    runs-on: ubuntu-latest
    services:
      # As above: a real server, matching packages/db/docker-compose.yml.
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: canoncore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The base commit is needed to build the ladder as it stands today.
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      # THE GATE (ADR-0047). Empty to head, on every run, failing the build if
      # the ladder does not compose from nothing.
      #
      # It is a local choice rather than an industry standard, and worth saying
      # so: not one of Drizzle, Prisma, Alembic, Flyway or Rails ships an
      # empty-to-head gate as a named command, and Rails documents preferring a
      # schema load to replaying history -- because old migrations rot against
      # application code that has moved on. At one rung that objection does not
      # bite, and the gate is cheap and genuinely valuable.
      - name: Build the database from empty and apply every migration
        run: |
          psql "$ADMIN_URL" -c 'create database empty_to_head'
          # THE GUARD MATTERS MOST HERE OF ANYWHERE (CNCORE-191). Turbo exits
          # 0 having run zero tasks, so without it this gate would report a
          # database built from NOTHING as built correctly -- ADR-0047's whole
          # claim, passing on a run that applied no rung at all.
          #
          # The task is not spelled out in this comment on purpose: the check
          # that keeps these guarded matches the NAME wherever it appears in a
          # `run:` block, shell comments included, and cannot tell prose from a
          # command. Naming it here would report this very step as unguarded.
          DATABASE_URL="${BASE_URL}/empty_to_head" .github/scripts/run-suite.sh db:migrate

      # AND WHAT THE GATE CANNOT SEE. Building from empty applies every rung
      # regardless of the high-water mark Drizzle uses against a POPULATED
      # database, so the gate above goes green on exactly the divergence that
      # would break a real upgrade. This is that upgrade, run for real: the base
      # branch's ladder first, then this branch's on top of it.
      - name: Apply this branch's rungs on top of the base branch's
        # BASE_REF is bound here rather than interpolated into the script below.
        # A branch name comes from the webhook payload and may contain shell
        # metacharacters; `${{ }}` pastes it into the shell before bash sees it,
        # where `$VAR` is just a string.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          # Fetched explicitly rather than assumed present: what a checkout
          # leaves in the local ref namespace is not something to rely on.
          git fetch --no-tags --depth=100 origin "$BASE_REF"
          base=$(git merge-base FETCH_HEAD HEAD)
          echo "base commit: $base"
          psql "$ADMIN_URL" -c 'create database upgrade_path'
          mkdir -p /tmp/base-ladder
          if git cat-file -e "$base:packages/db/src/migrations/meta/_journal.json" 2>/dev/null; then
            git archive "$base" packages/db/src/migrations | tar -x -C /tmp/base-ladder
            DATABASE_URL="${BASE_URL}/upgrade_path" \
              node packages/db/scripts/migrate.ts /tmp/base-ladder/packages/db/src/migrations
          else
            echo "the base commit carries no ladder; the upgrade path starts empty."
          fi

          # Between the two: the checks Drizzle's own migrator does not perform.
          # This is the ONLY place the freeze check means anything -- the ledger
          # here was written from the base branch's files, so a rung this branch
          # edited or withdrew is visible. Run against a database this branch
          # built itself it would be comparing files to their own hashes.
          DATABASE_URL="${BASE_URL}/upgrade_path" .github/scripts/run-suite.sh db:check-ladder

          DATABASE_URL="${BASE_URL}/upgrade_path" .github/scripts/run-suite.sh db:migrate

      # A pg_dump comparison of the two databases was considered and left out.
      # It would catch a rung silently SKIPPED -- but the journal check above
      # makes a skip unreachable, because Drizzle can only skip what sits below
      # the high-water mark and nothing is allowed below it. The comparison also
      # needs a pg_dump matching the server major, which the runner does not
      # ship. Revisit if the journal check is ever relaxed.

  e2e:
    name: The page over HTTP
    runs-on: ubuntu-latest
    services:
      # As above: a real server, matching packages/db/docker-compose.yml.
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: canoncore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
      # Builds Next, starts it, and asks it for /items/<id> over real HTTP. The
      # only check in the repo that fails if the page is unreachable: every
      # other suite passes with the app never having been served.
      - name: The page over HTTP, and a count that says a suite ran
        run: .github/scripts/run-suite.sh test:e2e

  browser:
    name: The page in a browser
    runs-on: ubuntu-latest
    # ITS OWN JOB, WHICH IS CNCORE-73's FIRST ACCEPTANCE CRITERION, and it was
    # decided against the duplicated setup rather than against money: CNCORE-80
    # established that standard runners are free in a public repository, so a
    # fourteenth job costs $0.00 and so does folding (ADR-0111, corrected).
    #
    # WHAT IT DUPLICATES IS ONE INSTANCE, not the seven `The page over HTTP`
    # stands up: a suite asserting one claim needs one ordering to drag, and no
    # provider at all. What the split buys is that a flake in the most brittle
    # thing in this repository reddens a check called `The page in a browser`
    # rather than the one that says the app serves pages.
    services:
      # As above: a real server, matching packages/db/docker-compose.yml.
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: canoncore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
      # THE HEADLESS SHELL AND NOTHING ELSE. `--only-shell` fetches
      # `chrome-headless-shell` at about 122 MB instead of the full browser, and
      # it is what `chromium.launch()` resolves to in headless mode -- read out
      # of playwright-core 1.63.0's own `getExecutableName`, which answers
      # `chromium-headless-shell` when `headless` and no channel is named. The
      # alternative was Playwright's Docker image at 956 MB, for a browser this
      # job uses once.
      #
      # AND THE BINARIES ARE NOT CACHED, deliberately. Playwright's own
      # documentation advises against caching them: the download is quick and a
      # cache keyed wrong serves a browser that does not match the library,
      # which fails as a protocol error rather than as a cache miss.
      - name: Install the headless shell
        run: pnpm --filter web exec playwright install --with-deps --only-shell chromium
      # Builds Next, starts it, and drags a row in a real browser. The only
      # check in the repo that fails if the drag stops working, and the only one
      # permitted to assert anything a browser is needed for (ADR-0103).
      - name: The drag in a browser, and a count that says a suite ran
        run: .github/scripts/run-suite.sh test:browser

  # THE ONE QUESTION A JOB IS NOT ALLOWED TO ASK ITSELF (CNCORE-203).
  #
  # `provider-tmdb` refuses to start without `TMDB_READ_ACCESS_TOKEN` (ADR-0035,
  # and see the long note in the `provider` job below), GitHub keeps a SEPARATE
  # secret store for Dependabot, and this repository deliberately has nothing in
  # it (ADR-0139). So on every Dependabot pull request the two jobs underneath
  # died at `Initialize containers` with `Failed to initialize container`, before
  # their first step, and reported red about a credential rather than about the
  # bump. Seventeen bumps arrived on 2026-09-18 carrying two meaningless red
  # checks each, which is a merge gate spent on nothing.
  #
  # A STEP-LEVEL CONDITION CANNOT REACH THIS. A service container that will not
  # start takes the job down before any step runs, so the gate has to be the
  # job's own `if:`. And `jobs.<job_id>.if` CANNOT SEE `secrets`: GitHub's
  # context availability table gives it `github, needs, vars, inputs` and
  # nothing else. `jobs.<job_id>.outputs` can see it. That pair is the whole
  # reason this job exists -- it holds the one expression permitted to look, and
  # the jobs that need the answer read it back through `needs`.
  #
  # IT PUBLISHES A VERDICT AND NEVER THE VALUE. An output whose text matches a
  # secret is redacted on the runner and arrives empty, so a job that passed the
  # token itself along would gate on the empty string forever -- failing closed,
  # permanently, and looking exactly like a run with no credential. `true` or
  # `false` is also the entirety of what a gate needs.
  #
  # IT IS NOT GATED ON ANYTHING ITSELF, which is what keeps it honest: it runs
  # on every pull request and says, in the log, which way it went and why.
  credentials:
    name: Which provider credentials this run can reach
    runs-on: ubuntu-latest
    outputs:
      tmdb: ${{ steps.tmdb.outputs.reachable }}
    steps:
      # No checkout and no install. The answer is already in the environment,
      # and a job that cloned the repository to read it would be paying setup
      # for nothing.
      - name: TMDB_READ_ACCESS_TOKEN
        id: tmdb
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TMDB_READ_ACCESS_TOKEN:-}" ]; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "TMDB_READ_ACCESS_TOKEN is reachable, so the jobs that start provider-tmdb will run."
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "TMDB_READ_ACCESS_TOKEN is empty on this run, so the two jobs that start provider-tmdb are skipped rather than failed."
            echo "::notice::On a Dependabot pull request this is expected and is not a defect: Dependabot reads a secret store of its own, and ADR-0139 keeps this token out of it on purpose. Everything else on this run still checks the bump."
          fi

      # THE GATE'S ONE WAY OF GOING QUIET FOREVER, closed here.
      #
      # Keying on the credential rather than on the author is what makes this
      # fix cover a fork as well as Dependabot -- and it is also what would let
      # a DELETED OR RENAMED repository secret skip both jobs on `main`,
      # green, with the contract suite then running nowhere at all. A check that
      # passes without running is the defect this repository already has a
      # record about; trading one for another would be no fix.
      #
      # A PULL REQUEST HAS TWO INNOCENT EXPLANATIONS and a push has none.
      # Dependabot reads its own store, a fork gets no repository secret, and
      # neither is anything the contributor can do about. A push to `main` or a
      # version tag is neither, so an absent credential there is the secret
      # having gone, and the honest report is red.
      #
      # `if:` RATHER THAN A BRANCH IN THE SCRIPT ABOVE, deliberately: a
      # condition in YAML is one `ci-workflow.test.ts` can EVALUATE against a
      # synthetic context, the way it already evaluates the concurrency key,
      # while a branch in shell could only be matched as text.
      - name: Off a pull request, an absent credential is a deleted secret
        if: steps.tmdb.outputs.reachable != 'true' && github.event_name != 'pull_request'
        run: |
          echo "::error::TMDB_READ_ACCESS_TOKEN is empty on a ${GITHUB_EVENT_NAME} run of ${GITHUB_REF}. Only a pull request can legitimately lack it (ADR-0139) -- Dependabot reads its own secret store and a fork gets none -- so on this ref it means the repository secret has been deleted or renamed. Skipping here would leave the contract suite running nowhere at all, green."
          exit 1

  provider:
    name: Import and browse over HTTP, against the real provider-tmdb
    runs-on: ubuntu-latest
    needs: credentials
    # THE GATE. Its shape, and why it is not a step, is in the `credentials`
    # job above. What it costs is stated here: with the token absent this job
    # is SKIPPED rather than run, so `test:e2e` against the real image is not
    # checked on that run. The `e2e` job runs the same suite against the stub
    # and is not gated, so what is lost is the real provider specifically --
    # which is the half no run without a credential could ever have had.
    if: needs.credentials.outputs.tmdb == 'true'
    # It needs only read. The image is private and stays private: ADR-0089 keeps
    # both providers off a public registry, so a publicly pullable image would
    # be distribution.
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: canoncore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # CNCORE-16's image, and THE ONLY REAL PROVIDER THIS JOB CAN DRIVE THE APP
      # AGAINST (CNCORE-143). `:latest` rather than a digest ON PURPOSE: this
      # provider and this app are one contract in two repositories, and pinning
      # would let them drift silently until somebody bumped a hash. The contract
      # is what must not break, and this job is what says so.
      #
      # THE WIKI IMAGE IS NOT HERE, AND ITS ABSENCE IS THE DECISION. It was,
      # addressed by a PROVIDER_WIKI_URL that turbo filtered out of `test:e2e`,
      # so from CNCORE-100 until CNCORE-143 this job started it, sent it not one
      # request, and ran the same stub as the `e2e` job above while claiming
      # otherwise. Passing the variable through is one line and turns the job
      # red CORRECTLY: `provider-wiki` needs a Credential to answer anything
      # (ADR-0122), a CI container holds none, and `search` and `lookup` owe a
      # locked provider's `503` rather than a record -- so `global-setup`'s
      # import through the app cannot succeed against it. ADR-0122's own fixed
      # point is that NO CI JOB HOLDS THE OWNER'S SESSION, which rules out
      # unlocking one here rather than leaving it open. The real wiki image is
      # still under test in `contract` below, in the state CI can actually put
      # it in. Nothing was lost by dropping it from this job, because nothing
      # was being checked.
      #
      # IT NEEDS A CREDENTIAL AND THE WIKI'S IS THE ONE CI CANNOT SUPPLY, which
      # is ADR-0035 in operation rather than in principle: this image ships no
      # key and REFUSES TO START without one, so a container that runs at all is
      # one somebody configured. A token in the environment here is the instance
      # supplying its own, which is exactly what that record asks for -- and it
      # is a token in a secret rather than a browser session past a Cloudflare
      # challenge, which is the whole of why this provider can be driven here
      # and the wiki cannot.
      #
      # TMDB IS ALSO WHAT MAKES THE ATTRIBUTION PATH REAL: it is the first
      # source whose licence obliges the app to show anything, so ADR-0036's
      # notice and mark are rendered from what a real provider declared rather
      # than from a stub repeating the expected string back.
      #
      # NO STORED CREDENTIAL FOR THE REGISTRY. The provider-tmdb package grants
      # this repository read under Manage Actions access, so the workflow's own
      # GITHUB_TOKEN is the whole authentication story. A fine-grained token was
      # the original plan and does not exist for this registry -- GitHub
      # Packages accepts only a classic personal access token -- and a classic
      # one would be a broader credential than this job needs. ADR-0089 carries
      # the reasoning.
      provider-tmdb:
        image: ghcr.io/jacobdrees-canoncore/provider-tmdb:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        # Published to the host, because this job runs directly on the runner
        # rather than in a container: GitHub reaches a service container at
        # 127.0.0.1:<port> only when the port is mapped.
        ports:
          - 8081:8080
    env:
      # A CONFIG URL, and loopback (ADR-0034). It is legal because the
      # allowlist names 127.0.0.0/8 BY NAME -- the content deny rule still
      # classifies loopback as `loopback` and still refuses it there.
      #
      # `turbo.json` DECLARES THIS FOR `test:e2e`, or setting it here does
      # nothing at all. `packages/config/src/ci-task-env.test.ts` fails if that
      # declaration goes, which is the guard CNCORE-143 left behind rather than
      # the one-line fix it forced.
      PROVIDER_TMDB_URL: http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      # The image declares a HEALTHCHECK, and whether the runner waits on it is
      # not something to assume. Waiting here is three lines and turns "the
      # provider was not up yet" from a confusing e2e failure into a named one.
      #
      # The manifest is PRINTED rather than merely awaited, so `operations` is
      # in the log: the app reads that list and calls `browse` only if it is
      # declared (ADR-0033), so an image that stopped offering it would fail the
      # browse tests with BROWSE_NOT_OFFERED -- the contract breaking, named,
      # rather than a green run against a capability nobody shipped.
      - name: Wait for the provider to answer
        run: |
          set -euo pipefail
          answered=""
          for _ in $(seq 1 30); do
            if curl -sSf "$PROVIDER_TMDB_URL/" >/dev/null 2>&1; then
              echo "the provider at $PROVIDER_TMDB_URL answers:"
              curl -sS "$PROVIDER_TMDB_URL/" | head -c 400; echo
              answered=yes
              break
            fi
            sleep 1
          done
          if [ -z "$answered" ]; then
            echo "::error::the provider at $PROVIDER_TMDB_URL never answered."
            exit 1
          fi

      # The SAME suite the `e2e` job runs, with PROVIDER_TMDB_URL set: the
      # difference between the two runs is which process answers CMPP for the
      # TMDB fixtures and nothing else, so the assertions that hold the stub to
      # the contract are the ones holding the real image to it. `global-setup`
      # imports a real film through the app, browses a real collection, searches
      # for it, and renders ADR-0036's notice off what the image declared.
      #
      # AND THE COUNT MATTERS MOST HERE. This job's whole difference from the
      # `e2e` job above is which process answers CMPP, so a suite that ran zero
      # tasks would leave it green having started the real image, sent it
      # nothing, and reported that nowhere -- which is CNCORE-143 exactly.
      - name: The same suite against the real image, and a count that says it ran
        run: .github/scripts/run-suite.sh test:e2e

  contract:
    name: One contract, both providers, no app
    runs-on: ubuntu-latest
    needs: credentials
    # THE SAME GATE, AND IT COSTS MORE HERE. `test:contract` runs nowhere else,
    # so a run without the token checks the contract not at all. Running it
    # against `provider-wiki` alone was the alternative and is refused by the
    # job's own rule two comments down: a contract checked against one
    # participant is a schema test wearing a contract's name, which is a worse
    # answer than no answer because it is green.
    if: needs.credentials.outputs.tmdb == 'true'
    # THE SECOND SEAM, and the whole reason this job is separate from `provider`
    # above. That one drives the APP against a provider; this one calls both
    # providers DIRECTLY and asserts they answer the same shapes, the same claim
    # structure and the same failure modes. Run through the app they would both be
    # normalised into one shape before any assertion saw them, so the suite would
    # pass whether or not they agreed -- which is the exact failure it exists to
    # catch. `packages/contract` depends on no `@canoncore/*` package, so that
    # separation is structural rather than a rule somebody remembers.
    permissions:
      contents: read
      packages: read
    services:
      provider-wiki:
        image: ghcr.io/jacobdrees-canoncore/provider-wiki:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 8080:8080
      provider-tmdb:
        image: ghcr.io/jacobdrees-canoncore/provider-tmdb:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        ports:
          - 8081:8080
    env:
      PROVIDER_WIKI_URL: http://127.0.0.1:8080
      PROVIDER_TMDB_URL: http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      # BOTH, OR THE RUN MEANS NOTHING. The suite skips a provider whose URL is
      # unset, which is right on a laptop that cannot pull a private image and
      # wrong here: a contract checked against one participant is a schema test.
      - name: Both providers answer, and both are under test
        run: |
          set -euo pipefail
          for url in "$PROVIDER_WIKI_URL" "$PROVIDER_TMDB_URL"; do
            answered=""
            for _ in $(seq 1 30); do
              if curl -sSf "$url/" >/dev/null 2>&1; then answered=yes; break; fi
              sleep 1
            done
            if [ -z "$answered" ]; then
              echo "::error::the provider at $url never answered, so the contract would be checked against one participant."
              exit 1
            fi
            echo "$url declares: $(curl -sS "$url/" | head -c 200)"
          done

      - name: throwaway, to observe that a gated job still reddens
        run: |
          echo "::error::throwaway: a planted failure in the contract job."
          exit 1

      - name: Both providers against one contract, and a count that says a suite ran
        run: .github/scripts/run-suite.sh test:contract

  # THE IMAGE, BUILT ON EVERY PULL REQUEST AND PUBLISHED FROM `main` ALONE.
  #
  # Two jobs rather than one, and a matrix rather than one buildx call with two
  # platforms, because a cross-platform build on a single runner is EMULATED:
  # Docker's own documentation says QEMU emulation is "much slower", and the
  # arrangement that does it is one comma away from the arrangement that does
  # not. GitHub's arm64 runners are free on public repositories, so the native
  # matrix costs nothing here (verified 2026-09-11).
  #
  # `image.test.ts` holds the properties this file cannot show on its face: that
  # nothing publishes from a pull request, that each architecture lands on its
  # own metal, and that the licence label is stated rather than inherited.
  image:
    name: The image, built and run
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      # Both architectures are reported even when one fails. They fail for
      # different reasons -- a missing arm64 wheel is not a missing amd64 one --
      # and cancelling the other hides which.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    services:
      # The smoke test's database, and it starts EMPTY. That is the point: the
      # container is what migrates it, so an image that ships a broken ladder
      # fails here rather than in somebody's install.
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: canoncore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Tags and labels in ONE place, shared by the per-architecture push and by
      # the manifest list that merges them.
      #
      # THE LICENCE LABEL IS OVERRIDDEN RATHER THAN GENERATED. This action builds
      # it from GitHub's own detected licence, which is the deprecated bare
      # `AGPL-3.0` for this repository -- `licensee` does not parse SPDX
      # expressions, so the `-or-later` election cannot reach it. The action
      # keeps the LAST value given for a label name, which is what makes this
      # line win.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # `latest` MEANS THE HEAD OF `main` HERE, and a release must not move
          # it: `compose.yaml` names it and the README documents it as what a
          # merge publishes, so a tag re-pointing it would change that meaning
          # silently, and backwards if an older commit were ever tagged.
          #
          # IT WAS ALREADY NOT HAPPENING, BY ACCIDENT. `flavor.latest` defaults
          # to `auto`, under which `procSemver` computes latest for any
          # non-prerelease semver tag; `setVersion` only assigns when the flag
          # is still undefined, so the FIRST entry processed wins and `type=sha`
          # sits above `type=semver` and freezes it false. Swap those two lines
          # and the next release re-points `latest` with nothing in the diff
          # saying so (`src/meta.ts`, read 2026-09-12).
          #
          # This costs the default branch nothing: the flavor governs only the
          # AUTOMATIC latest, and the explicit `type=raw,value=latest` below is
          # emitted either way.
          flavor: latest=false
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            # THE RELEASE'S OWN TAG, and the only one a release note can name.
            # `type=semver` is documented for push-tag events and produces
            # nothing on a branch push, so `main` publishes exactly what it
            # published before this line existed. On `v0.1.0` it writes `0.1.0`:
            # the leading `v` is not part of a semver version, which is why the
            # git tag and the image tag differ by it.
            #
            # `{{version}}` ALONE. `{{major}}.{{minor}}` would add a moving
            # `0.1`, and `{{major}}` a `0` shared by the whole 0.x series --
            # neither is asked for, and a moving tag is a promise to keep
            # moving it.
            type=semver,pattern={{version}}

      # Loaded into the runner's own docker rather than pushed, so the steps
      # below can run it. One platform: this runner's.
      - name: Build it for this runner's architecture
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: canoncore:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # THE ASSERTION THAT THE DATABASE STARTS EMPTY, which is what makes the
      # next step mean anything. `psql` runs inside the service container rather
      # than on the runner: the arm64 image is managed by Arm and is not the
      # same fleet as ubuntu-latest, so a client on the host is not something to
      # assume.
      - name: The database has no ladder applied yet
        env:
          POSTGRES: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          applied=$(docker exec "$POSTGRES" psql -U postgres -d canoncore -tAc \
            "select count(*) from information_schema.schemata where schema_name = 'drizzle'")
          echo "drizzle schemas before the container runs: $applied"
          [ "$applied" = "0" ] || { echo "::error::the database was already migrated, so the next step proves nothing."; exit 1; }

      - name: It migrates that database and then serves a page
        run: |
          set -euo pipefail
          docker run -d --name canoncore --network host \
            -e DATABASE_URL=postgresql://postgres:password@127.0.0.1:5432/canoncore \
            -e PORT=3210 \
            canoncore:smoke

          answered=""
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3210/ >/dev/null 2>&1; then answered=yes; break; fi
            if [ -z "$(docker ps -q -f name=canoncore)" ]; then break; fi
            sleep 1
          done
          docker logs canoncore
          if [ -z "$answered" ]; then
            echo "::error::the container never answered on 3210."
            exit 1
          fi

          # A route that READS THE DATABASE. `/` is static and would answer 200
          # with the server never having opened a connection. An unknown id must
          # come back 404 -- the app asked and found nothing -- and never 500,
          # which is what an unmigrated or unreachable database produces.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:3210/items/00000000-0000-0000-0000-000000000000)
          echo "an unknown item answers $code"
          [ "$code" = "404" ] || { echo "::error::a database-backed route answered $code, not 404."; exit 1; }

      - name: And the ladder it applied is the one in this branch
        env:
          POSTGRES: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          applied=$(docker exec "$POSTGRES" psql -U postgres -d canoncore -tAc \
            "select count(*) from drizzle.__drizzle_migrations")
          rungs=$(find packages/db/src/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')
          echo "rungs in the branch: $rungs, rows in the ledger: $applied"
          [ "$applied" = "$rungs" ] || { echo "::error::the image applied $applied rungs and this branch has $rungs."; exit 1; }

      # THE ORDERING, TESTED RATHER THAN ASSUMED. The entrypoint migrates and
      # then `exec`s the server, so a ladder that cannot be applied must take the
      # container down with it. Without this, `set -e` in a shell script is a
      # claim nobody has checked.
      - name: It refuses to serve when the ladder cannot be applied
        run: |
          set -euo pipefail
          if docker run --rm --network host \
               -e DATABASE_URL=postgresql://postgres:password@127.0.0.1:1/canoncore \
               canoncore:smoke > unmigrated.log 2>&1; then
            echo "::error::the container started its server against a database it could not migrate."
            tail -20 unmigrated.log
            exit 1
          fi
          echo "it exited rather than serving, as it should:"
          tail -5 unmigrated.log

      # WHAT IS IN THE LAYERS, which is invisible until somebody pulls it.
      # `/app` is the whole of this image's own content -- everything else came
      # from `node:<major>-slim` -- so it is the complete search rather than a
      # sample.
      - name: It carries no .env, no pnpm, no dev dependencies, and the licence
        run: |
          set -euo pipefail
          fail=0
          found=$(docker run --rm --entrypoint find canoncore:smoke /app -name '.env*' | head -20)
          if [ -n "$found" ]; then
            echo "::error::the image carries an env file: $found"
            fail=1
          fi
          if docker run --rm --entrypoint sh canoncore:smoke -c 'command -v pnpm' >/dev/null 2>&1; then
            echo "::error::the runner stage has pnpm in it."
            fail=1
          fi
          # typescript is the specific dev dependency that nearly arrived here:
          # it is an OPTIONAL PEER of drizzle-orm, so a migrator tree resolved
          # with peers on drags 30 MB of it into a production image.
          for module in typescript vitest turbo; do
            if docker run --rm --entrypoint find canoncore:smoke /app -maxdepth 6 -type d -name "$module" | grep -q .; then
              echo "::error::the runner stage carries the $module dev dependency."
              fail=1
            fi
          done
          docker run --rm --entrypoint sh canoncore:smoke -c 'head -2 /app/LICENSE' \
            || { echo "::error::the image conveys the work without the licence text."; fail=1; }
          exit $fail

      # WHAT MAY PUBLISH, AND IT IS REPEATED RATHER THAN DERIVED. Four steps
      # and one job carry this condition: a job-level `if` cannot read `env`, so a computed
      # one would have to be spelled out here anyway and would then be two
      # derivations instead of one. `image.test.ts` evaluates EVERY conditioned
      # step in these jobs against five events with GitHub's own parser, so the
      # copies cannot drift without going red -- which is what makes repeating
      # it the cheaper of the two.
      #
      # A VERSION TAG PUBLISHES AND A TAG IS NOT A BRANCH. `github.ref` on a tag
      # push is `refs/tags/v0.1.0`, so every one of these was false under the
      # release and CNCORE-70 would have tagged a commit and published nothing.
      # `refs/tags/v` and not `refs/tags/`: see `on:` at the top of the file.
      - name: Log in to the registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PUSHED BY DIGEST, WITHOUT A TAG. Two runners cannot both write the same
      # tag and have the second not replace the first; each pushes an untagged
      # manifest instead and the job below binds the tags to a list of the two.
      # The build itself is a cache hit on the one above.
      - name: Push this architecture by digest
        id: push
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Hand the digest to the manifest job
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
          echo "${PLATFORM} -> ${DIGEST}"

      - name: Upload the digest
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          # `/` is not legal in an artifact name.
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ONE IMAGE OUT OF THE TWO BUILDS. A `docker pull` resolves the architecture
  # it needs from this manifest list; without it the tag would name whichever
  # architecture pushed last.
  image-manifest:
    name: One image, both architectures
    needs: image
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # Same statement as the build job above, where the reasoning is.
          flavor: latest=false
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            # The release's own tag. Same line as the build job above, where
            # the reasoning is; it is the manifest list that binds it to both
            # architectures, so both steps must write it.
            type=semver,pattern={{version}}

      - name: Bind the tags to both architectures
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # The digests are file NAMES rather than file contents, which is the
          # shape Docker's own documentation uses: an artifact per architecture,
          # merged into one directory, and every entry is one manifest.
          #
          # CHECKED BEFORE THEY ARE EXPANDED INTO AN ARGUMENT LIST, because an
          # empty directory is the failure this cannot otherwise survive: `*`
          # would go unexpanded and the command would be handed the literal
          # `<image>@sha256:*`, failing somewhere further in with a message about
          # a reference rather than about a missing artifact. A name that is not
          # 64 hex characters means the same thing -- something other than the
          # push step wrote here -- and the same loop catches both.
          found=0
          for digest in *; do
            case "$digest" in
              *[!0-9a-f]*) echo "::error::'$digest' in the digest directory is not a sha256 digest. Either the download found no artifact and left the glob unexpanded, or something other than the push step wrote here."; exit 1 ;;
            esac
            [ ${#digest} -eq 64 ] || { echo "::error::'$digest' is not 64 hex characters, so it is not a manifest digest."; exit 1; }
            found=$((found + 1))
          done
          [ "$found" -ge 2 ] || { echo "::error::found $found digests and this image is built for two architectures. A manifest list bound to one of them publishes a tag that resolves for half the machines pulling it."; exit 1; }
          echo "binding the tags to $found architecture digests"
          #
          # shellcheck disable=SC2046 # both expansions are lists of arguments,
          # and quoting them would pass each list as one argument.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      # THE RUN LOG'S ONLY RECORD OF A RELEASE, so it reports the tags THIS run
      # bound rather than a tag it assumes exists. It named `:latest`, which was
      # true while `main` was the only thing that published; a version tag does
      # not write `latest` (`{{is_default_branch}}` is false with no branch), so
      # on a release that line inspected the previous push's image and presented
      # it as this one's.
      - name: Say what was published
        run: |
          set -euo pipefail
          # COUNTED BEFORE IT IS WALKED, for the reason the digest loop above
          # gives about an empty directory: `while read` over no lines exits 0
          # having printed nothing, so a run that bound no tags at all would
          # report success by saying nothing rather than by saying so.
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          [ "${#tags[@]}" -gt 0 ] || { echo "::error::the metadata step produced no tags, so this run bound none and published nothing under a name."; exit 1; }
          for tag in "${tags[@]}"; do
            docker buildx imagetools inspect "$tag"
          done

      # THE PACKAGE IS PUBLIC, AND NO WORKFLOW CAN MAKE IT SO.
      #
      # GitHub's own words: "if you publish a package that is linked to a
      # repository, the package automatically inherits the access permissions
      # (but not the visibility) of the linked repository" -- so this PUBLIC
      # repository publishes a PRIVATE package, and the organisation packages
      # API has no endpoint that changes visibility. It is a web-UI click, the
      # same class of manual step ADR-0089 already records for the registry
      # grant.
      #
      # TWO CLICKS, IN TWO PLACES, AND THE FIRST ONE IS THE ONE NOBODY EXPECTS.
      # Measured on 2026-09-11 under CNCORE-64: this organisation's Package
      # creation policy allowed Private and Internal only, so the package's own
      # Change visibility dialog rendered its Public option DISABLED, under the
      # words "Setting is disabled by organization administrators". Somebody
      # following an instruction that named only the package's own settings
      # would arrive at a greyed-out radio button with nothing to click and no
      # statement of what to do about it. The message below names both, in the
      # order they have to happen.
      #
      # ASSERTED BECAUSE THE FAILURE IS INVISIBLE TO US. Everyone who would test
      # the install path is logged in to ghcr.io, so a private package pulls
      # perfectly for them and for nobody else -- and "nobody else" is the whole
      # audience a published image has. ADR-0089 requires the mirror of this on
      # the provider images, which assert they have not stopped reading
      # `private`; this is the same mechanism with the opposite answer.
      #
      # The identity comes out of IMAGE rather than being rebuilt from
      # `github.repository`, so this cannot end up asking about a package the
      # push above did not write (CNCORE-45). `-u` is load-bearing: drop that
      # env entry and this stops dead rather than querying an empty name.
      - name: Assert a stranger can pull it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IFS=/ read -r registry owner package extra <<<"${IMAGE,,}"
          if [ "$registry" != "ghcr.io" ] || [ -z "$owner" ] || [ -z "$package" ] || [ -n "$extra" ]; then
            echo "::error::IMAGE is '$IMAGE', which this step cannot read as ghcr.io/<owner>/<package>. Teach it the new shape here rather than letting it assert on a package nothing pushed."
            exit 1
          fi
          visibility=$(gh api "/orgs/$owner/packages/container/$package" --jq .visibility)
          echo "the published package reads $visibility"
          if [ "$visibility" != "public" ]; then
            echo "::error::The image published to $IMAGE is '$visibility'. A package does NOT inherit its repository's visibility, so it starts private and no API can change it. TWO web-UI steps, in this order: (1) https://github.com/organizations/$owner/settings/packages -> Package creation -> tick Public -> Save, because while that policy forbids public packages the dialog in step 2 renders its Public option disabled and says only 'Setting is disabled by organization administrators'; (2) https://github.com/orgs/$owner/packages/container/$package/settings -> Danger Zone -> Change visibility -> Public, typing '$package' to confirm. Until both are done every docker pull by somebody who is not a member of this organisation fails, which is the only audience this image has."
            exit 1
          fi
