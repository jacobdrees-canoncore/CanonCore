name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # GitHub's own secret scanning needs paid Secret Protection on private repos.
      # gitleaks covers the same ground for free. Run the binary directly rather than
      # gitleaks-action, which requires a paid licence key for organisation repos.
      # `git` replaced `detect --source` in v8.19.0; the old form is deprecated and hidden.
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git --no-banner --redact --verbose /repo

  docs:
    name: Agent docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: CLAUDE.md stays under 200 lines
        run: |
          lines=$(wc -l < CLAUDE.md)
          echo "CLAUDE.md is $lines lines"
          if [ "$lines" -ge 200 ]; then
            echo "::error file=CLAUDE.md::CLAUDE.md is $lines lines. The 13th principle in docs/agents/standard.md: \"Keep this file a pointer file, under 200 lines. Repeated gotchas become checks (lint, hooks, CI), not prose here.\""
            exit 1
          fi
      # CanonCore holds the one copy of the standard, so there is nothing to compare it
      # with here; each other repository's CI is to compare its copy with this repo's main.
      - name: CLAUDE.md imports the standard
        run: |
          grep -qx '@docs/agents/standard.md' CLAUDE.md || {
            echo "::error file=CLAUDE.md::CLAUDE.md must import @docs/agents/standard.md on a line of its own."
            exit 1
          }
      - name: Agent docs referenced by CLAUDE.md exist
        run: |
          fail=0
          for f in docs/agents/standard.md docs/agents/issue-tracker.md docs/agents/triage-labels.md docs/agents/domain.md; do
            [ -f "$f" ] || { echo "::error::missing $f"; fail=1; }
          done
          exit $fail

  # Add lint / typecheck / test jobs here once a stack exists. Keep them as separate
  # jobs so a red check names the thing that broke.
